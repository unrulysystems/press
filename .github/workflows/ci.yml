name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Check, Test, E2E
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/press-ms-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: nub ci

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Check
        run: nub run check

      - name: Unit tests
        run: nub run test

      - name: E2E
        run: nub run e2e
