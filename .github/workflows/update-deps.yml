name: Update Dependencies

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.10.4'

      - name: Update mise toolchain pins and lockfile
        # URL overrides require refreshing upstream digests with the version.
        run: mise upgrade --bump --exclude github:0xbigboss/silo --exclude github:nodejs/node

      - name: Update npm packages
        run: bun update

      - name: Install and verify
        run: |
          bun install
          bun run check

      - name: Build
        run: bun run build

      - name: Open dependency update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: 'chore: weekly dependency updates'
          title: 'chore: weekly dependency updates'
          body: |
            Weekly dependency update generated by the scheduled workflow.

            Changed inputs may include:
            - Toolchain pins and `mise.lock` from `mise upgrade --bump`
            - npm packages from `bun update`

            Verification run before opening this PR:
            - `bun install`
            - `bun run check`
            - `bun run build`
          branch: chore/weekly-dependency-updates
          delete-branch: true
