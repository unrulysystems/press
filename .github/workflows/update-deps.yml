name: Update Dependencies

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0

      - name: Update .node-version to latest LTS
        run: |
          LATEST_LTS=$(curl -s https://nodejs.org/dist/index.json | \
            jq -r '[.[] | select(.lts != false)] | first | .version' | \
            sed 's/^v//')
          echo "$LATEST_LTS" > .node-version

      - name: Update npm packages
        run: nub update

      - name: Update Nix flake inputs
        run: nix flake update

      - name: Install and verify
        run: |
          nub install
          nub run check

      - name: Build
        run: nub run build

      - name: Open dependency update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: 'chore: weekly dependency updates'
          title: 'chore: weekly dependency updates'
          body: |
            Weekly dependency update generated by the scheduled workflow.

            Changed inputs may include:
            - `.node-version` latest LTS
            - npm packages from `nub update`
            - Nix flake inputs from `nix flake update`

            Verification run before opening this PR:
            - `nub install`
            - `nub run check`
            - `nub run build`
          branch: chore/weekly-dependency-updates
          delete-branch: true
