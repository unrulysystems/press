name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Full Harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/press-ms-playwright
      # Non-interactive Tilt so `silo up` (which runs `tilt`) never opens an editor.
      TILT_EDITOR: 'true'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        timeout-minutes: 5
        with:
          version: '2026.10.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 10

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        timeout-minutes: 10

      - name: Check
        run: bun run check
        timeout-minutes: 10

      - name: Unit tests
        run: bun run test
        timeout-minutes: 10

      - name: E2E
        run: bun run e2e
        timeout-minutes: 15

      - name: Build web
        run: bun run build:web
        timeout-minutes: 15

      - name: Image smoke
        run: bun run smoke:image
        timeout-minutes: 30
