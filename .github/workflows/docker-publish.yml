---
name: Publish image

# Builds the press runtime image (Dockerfile) and publishes it to the repo's GitHub
# Container Registry namespace. This is the SOURCE image that 0xsend/press-deploy mirrors
# into ghcr.io/0xsend/press for the Swiss cluster. Packaging only — press is frozen, so
# this runs on demand (a version tag or a manual dispatch), not on every push.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mirror:
        description: 'Also notify 0xsend/press-deploy to mirror this build (needs MIRROR_DISPATCH_TOKEN)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/unrulysystems/press

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          # Semver tag on `v*` pushes; an immutable sha- tag always; `latest` only on a
          # manual dispatch from the default branch. Consumers should pin the sha- tag.
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Swiss cluster nodes are amd64-only Hetzner machines.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Optional convenience: kick the mirror in 0xsend/press-deploy. Requires a
      # MIRROR_DISPATCH_TOKEN secret (PAT with `repo` scope on 0xsend/press-deploy).
      # Left off by default — running the mirror manually after publish is fine.
      - name: Trigger mirror
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mirror }}
        env:
          GH_TOKEN: ${{ secrets.MIRROR_DISPATCH_TOKEN }}
        run: |
          gh api repos/0xsend/press-deploy/dispatches \
            -f event_type=press-image \
            -F client_payload[tag]="sha-$(git rev-parse --short HEAD)"
