# Application secrets, synced from 1Password by ESO. These land in the `press-secrets` Secret,
# which deployment.yaml mounts wholesale via envFrom — so each secretKey here IS the env var name
# press reads in apps/web/src/server/config.ts.
#
# SETUP: create 1Password item "Press Server" (Infrastructure vault) with three fields:
#   better-auth-secret   — >= 32 bytes of random. Generate once, e.g. `openssl rand -base64 48`.
#   google-client-id     — from the Google Cloud OAuth 2.0 "Web application" client.
#   google-client-secret — same client.
#
# The Google OAuth client must list https://press.onyx.unrulysystems.com as an authorized origin and
# https://press.onyx.unrulysystems.com/api/auth/callback/google as an authorized redirect URI.
#
# Boot is fail-closed (REQ-CFG-002 / REQ-AUTH-008): production refuses credential auth, so Google is
# the ONLY sign-in provider here. If these three are missing or wrong the pod exits rather than
# serving a /login that can never sign anyone in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: press-secrets
  namespace: press
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: press-secrets
    creationPolicy: Owner
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: Press Server
        property: better-auth-secret
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: Press Server
        property: google-client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: Press Server
        property: google-client-secret
---
# R2 credentials for the CNPG barman-cloud backups (database/cluster.yaml). Reuses the existing
# "R2 Backup Credentials" 1Password item shared by the cluster's other backup consumers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: press-r2-credentials
  namespace: press
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: press-r2-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: R2 Backup Credentials
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: R2 Backup Credentials
        property: secret-access-key
