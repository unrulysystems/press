name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Full Harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/press-ms-playwright
      # Non-interactive Tilt so `silo up` (which runs `tilt`) never opens an editor.
      TILT_EDITOR: 'true'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 5
        with:
          bun-version: '1.4.3'

      # The One server runs under Node, and page passwords need node:crypto
      # argon2 (Node 24.7+). The runner's default Node is older.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version

      # `bun run e2e` boots an isolated localnet via silo + Tilt (k3d disabled), so the
      # runner needs both on PATH. Docker + the compose plugin are preinstalled
      # system-wide on ubuntu-latest, so the compose CLI is discoverable here (unlike a
      # HOME-overridden sandbox). Pinned to the versions used locally.
      - name: Install silo + Tilt (localnet orchestration for e2e)
        run: |
          set -euo pipefail
          bun add -g @0xbigboss/silo@0.5.9
          # Extract the tilt binary straight into a PATH dir. Upstream's install.sh unpacks
          # `tilt` into the checkout CWD, which collides on the runner
          # (`tar: tilt: Cannot open: File exists`) and fails the job before any step runs.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/tilt-dev/tilt/releases/download/v0.36.0/tilt.0.36.0.linux.x86_64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" tilt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        timeout-minutes: 5

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 10

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        timeout-minutes: 10

      - name: Check
        run: bun run check
        timeout-minutes: 10

      - name: Unit tests
        run: bun run test
        timeout-minutes: 10

      - name: E2E
        run: bun run e2e
        timeout-minutes: 15

      - name: Build web
        run: bun run build:web
        timeout-minutes: 15

      - name: Image smoke
        run: bun run smoke:image
        timeout-minutes: 30
