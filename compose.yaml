name: ${COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: postgres:17
    ports:
      # Loopback-only (F-20): a 0.0.0.0 binding would expose the
      # known-credential dev database to the LAN on every developer machine.
      - '127.0.0.1:${PRESS_POSTGRES_PORT}:5432'
    environment:
      POSTGRES_DB: press
      POSTGRES_USER: press
      POSTGRES_PASSWORD: press
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U press -d press']
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
